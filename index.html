<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAN_E_E_E_ELK Dashboard</title>
    <link rel="icon" type="image/webp" href="/sticker.webp">
    <style>
        /* Base page layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; 
        }

        /* Top status bar (28px height) */
        #status-bar {
            height: 28px;
            background-color: #111;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 11px;
            letter-spacing: 0.5px;
            box-sizing: border-box;
            color: #aaa;
        }

        .status-item { margin-right: 15px; }
        .status-val { font-weight: bold; }
        .online { color: #00ff00; }
        .offline { color: #ff4444; }

        /* Grid layout: Top 3/5 height, Bottom 2/5 height split in two */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 3fr 2fr;
            gap: 10px;
            height: calc(100vh - 28px); 
            padding: 10px;
            box-sizing: border-box;
        }

        /* Top full-width chart container */
        .top-chart {
            grid-column: 1 / span 2;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Bottom cards */
        .bottom-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- System Status Bar -->
    <div id="status-bar">
        <div id="bot-services">
            Loading system status...
        </div>
        <div id="bot-time">
            -
        </div>
    </div>

    <!-- Dashboards Container -->
    <div class="dashboard-container">
        
        <!-- Top: Arb Spreads and Orders Graph (Full Width, 3/5 Height) -->
        <div class="top-chart">
            <iframe title="current_token_trade_graph" src="https://app.powerbi.com/view?r=eyJrIjoiMjY5OTAyZmUtZTRjMC00YTIxLWI2ZWEtMmVmZmY2M2IzZjk1IiwidCI6IjZhM2Q2MmExLWY5YjYtNGRiNC05ZWMxLTQwMDM3MmQ4NjhjMCIsImMiOjl9" allowFullScreen="true"></iframe>
        </div>

        <!-- Bottom Left: Selected Token Strategy Stats -->
        <div class="bottom-card">
            <iframe title="current_choosen_tokens_table" src="https://app.powerbi.com/view?r=eyJrIjoiZjJiZTcwYTQtMTE1Mi00MzMxLWFhNDUtYzg5ODliODk1NzUxIiwidCI6IjZhM2Q2MmExLWY5YjYtNGRiNC05ZWMxLTQwMDM3MmQ4NjhjMCIsImMiOjl9" allowFullScreen="true"></iframe>
        </div>

        <!-- Bottom Right: Live Trade Metrics -->
        <div class="bottom-card">
            <iframe title="table with current trade data" src="https://app.powerbi.com/view?r=eyJrIjoiZjI4YzcyYjItNGVmZS00YjY3LTkyMGQtZWQwOWVkMjI2MDNjIiwidCI6IjZhM2Q2MmExLWY5YjYtNGRiNC05ZWMxLTQwMDM3MmQ4NjhjMCIsImMiOjl9" allowFullScreen="true"></iframe>
        </div>

    </div>

    <script>
        async function getStatus() {
            try {
                const url = 'https://storage.googleapis.com/perps_bots_data/status.json?nocache=' + new Date().getTime();
                const response = await fetch(url);
                const data = await response.json();
                
                let html = "";
                for (const [name, status] of Object.entries(data.services)) {
                    const statusClass = (status === "ONLINE") ? "online" : "offline";
                    html += `<span class="status-item">${name.toUpperCase()}: <span class="status-val ${statusClass}">${status}</span></span>`;
                }
                
                document.getElementById('bot-services').innerHTML = html;
                document.getElementById('bot-time').innerText = "LAST SYNC: " + data.last_update;
                
            } catch (error) {
                document.getElementById('bot-services').innerHTML = '<span class="offline">CONNECTION ERROR</span>';
                console.error("Status fetch error:", error);
            }
        }

        // Poll system status every 60 seconds
        setInterval(getStatus, 60000);
        getStatus();
    </script>

</body>
</html>
